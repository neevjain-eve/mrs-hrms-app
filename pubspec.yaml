name: mrs_hrms
description: MRS HRMS - Enterprise HR & Payroll App
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  percent_indicator: ^4.2.3
  month_year_picker: ^0.4.0
  table_calendar: ^3.0.9
  timeline_tile: ^2.0.0

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0

  # Location & QR
  geolocator: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1
  permission_handler: ^11.3.0

  # Files
  open_file: ^3.3.2
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  image_picker: ^1.0.7

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.1.0
  connectivity_plus: ^6.0.2
  package_info_plus: ^8.0.0
  share_plus: ^9.0.0

  # PDF
  printing: ^5.12.0
  pdf: ^3.10.8

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
